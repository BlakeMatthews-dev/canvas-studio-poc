services:
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5440:5432"
    volumes:
      - /vmpool/docker/canvas-studio-pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: canvas_studio
      POSTGRES_USER: coinswarm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coinswarm_dev_2024}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coinswarm"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
